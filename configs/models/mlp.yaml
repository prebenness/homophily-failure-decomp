# MLP: Platonov ResNet graphless encoder (model-hyperparameter-defaults.md).
# Same skeleton as GCN but feed-forward-only blocks, no aggregation.
model: mlp
z_dim: 512
head_dropout: 0.2
encoder:
  hidden_dim: 512
  num_blocks: 5
  dropout: 0.2
train:
  optimizer: adamw
  lr: 3.0e-5
  weight_decay: 0.0
  max_epochs: 1000
