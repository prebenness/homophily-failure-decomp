# LINKX (PyG implementation, CUAI/Non-Homophily-Large-Scale training
# defaults; hidden 32 -> 512, out_channels 512 replacing the class output).
model: linkx
z_dim: 512
head_dropout: 0.2
encoder:
  hidden_dim: 512
  out_dim: 512
  num_layers: 2
  num_edge_layers: 1
  num_node_layers: 1
  dropout: 0.5
train:
  optimizer: adamw
  lr: 0.01
  weight_decay: 1.0e-3
  max_epochs: 500
